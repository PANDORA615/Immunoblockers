name: Publish verified APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed artifact
        run: |
          echo '0d4d981ed095a1a89186ed8ec34b5eee55190c3108dce94b528f21979c3c6afa  distribution/Immunoblockers-0.3.0-universal.apk' | sha256sum --check
      - name: Publish one universal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.0 distribution/Immunoblockers-0.3.0-universal.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v0.3.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest --title 'Immunoblockers 0.3.0 — Glass, OTA и режим пары' --notes-file docs/RELEASE.md
          else
            gh release create v0.3.0 distribution/Immunoblockers-0.3.0-universal.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Immunoblockers 0.3.0 — Glass, OTA и режим пары' --notes-file docs/RELEASE.md --latest
          fi
