name: Publish verified APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed artifact
        run: |
          echo 'bae27e07775e3ba568a1c381f47116b2d5770c0f80513cc080b2be5f2f127ff7  distribution/Immunoblockers-0.2.0-universal.apk' | sha256sum --check
      - name: Publish one universal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.2.0 distribution/Immunoblockers-0.2.0-universal.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v0.2.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest --title 'Immunoblockers 0.2.0 — виджеты и журнал' --notes-file docs/RELEASE.md
          else
            gh release create v0.2.0 distribution/Immunoblockers-0.2.0-universal.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Immunoblockers 0.2.0 — виджеты и журнал' --notes-file docs/RELEASE.md --latest
          fi
