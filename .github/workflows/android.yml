name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v0.1.0 preview release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore preview signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/preview.jks"
            echo "IMMUNOBLOCKERS_KEYSTORE=$RUNNER_TEMP/preview.jks" >> "$GITHUB_ENV"
            echo "IMMUNOBLOCKERS_STORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Prepare universal APK
        run: cp app/build/outputs/apk/release/app-release.apk Immunoblockers-0.1.0-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Immunoblockers-universal
          path: Immunoblockers-0.1.0-universal.apk
      - name: Publish preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$IMMUNOBLOCKERS_KEYSTORE"
          gh release create v0.1.0 Immunoblockers-0.1.0-universal.apk --target "$GITHUB_SHA" --title 'Immunoblockers 0.1.0 — Android preview' --notes-file docs/RELEASE.md
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Room, notifications and Compose on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew installDebug installDebugAndroidTest
            adb shell pm grant com.immunoblockers android.permission.POST_NOTIFICATIONS
            ./gradlew connectedDebugAndroidTest || { cat app/build/outputs/androidTest-results/connected/debug/*.xml; adb logcat -d -s AndroidRuntime; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-reports
          path: app/build/reports/androidTests/
