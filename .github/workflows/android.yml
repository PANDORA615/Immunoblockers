name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v0.3.0 preview release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore preview signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/preview.jks"
            echo "IMMUNOBLOCKERS_KEYSTORE=$RUNNER_TEMP/preview.jks" >> "$GITHUB_ENV"
            echo "IMMUNOBLOCKERS_STORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
      - run: python -m unittest discover -s server
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Prepare universal APK
        run: cp app/build/outputs/apk/release/app-release.apk Immunoblockers-0.3.0-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Immunoblockers-universal
          path: Immunoblockers-0.3.0-universal.apk
      - name: Publish preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$IMMUNOBLOCKERS_KEYSTORE"
          gh release create v0.3.0 Immunoblockers-0.3.0-universal.apk --target "$GITHUB_SHA" --title 'Immunoblockers 0.3.0 — Android preview' --notes-file docs/RELEASE.md
  device-tests:
    name: Android ${{ matrix.api }} device tests
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Start isolated HTTPS pairing relay
        run: |
          mkdir -p app/src/debug/res/raw
          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/relay.key" -out app/src/debug/res/raw/test_ca.pem -days 1 -nodes -subj '/CN=Immunoblockers test relay' -addext 'subjectAltName=IP:10.0.2.2,DNS:localhost'
          PAIR_DB="$RUNNER_TEMP/pairs.sqlite3" RELAY_TLS_CERT="$PWD/app/src/debug/res/raw/test_ca.pem" RELAY_TLS_KEY="$RUNNER_TEMP/relay.key" nohup python server/relay.py > "$RUNNER_TEMP/relay.log" 2>&1 &
      - name: Room, widgets, journal and Compose
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew installDebug installDebugAndroidTest
            if [ ${{ matrix.api }} -ge 33 ]; then adb shell pm grant com.immunoblockers android.permission.POST_NOTIFICATIONS; fi
            if [ ${{ matrix.api }} -ge 31 ]; then adb shell appops set com.immunoblockers SCHEDULE_EXACT_ALARM allow; fi
            adb shell appwidget grantbind --package com.immunoblockers --user 0
            ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || { cat app/build/outputs/androidTest-results/connected/debug/*.xml; adb logcat -d -s AndroidRuntime; adb pull /sdcard/Android/data/com.immunoblockers/files/screenshots test-screenshots || true; exit 1; }
            adb pull /sdcard/Android/data/com.immunoblockers/files/screenshots test-screenshots
            if [ ${{ matrix.api }} -eq 35 ]; then python tools/record_demo.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-reports-${{ matrix.api }}
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-screenshots-${{ matrix.api }}
          path: test-screenshots/
